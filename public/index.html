<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Local Tee Times</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <h1>Local Tee Times</h1>
    <p>Find available tee times at courses near you.</p>
  </header>

  <main>
    <form id="search-form">
      <div class="field">
        <label for="location">Location</label>
        <div class="location-row">
          <input id="location" placeholder="Latitude, Longitude" required />
          <button type="button" id="use-location">Use my location</button>
        </div>
      </div>

      <div class="field">
        <label for="date">Date</label>
        <input id="date" type="date" required />
      </div>

      <div class="field">
        <label for="players">Players</label>
        <select id="players">
          <option value="1">1</option>
          <option value="2" selected>2</option>
          <option value="3">3</option>
          <option value="4">4</option>
        </select>
      </div>

      <div class="field">
        <label for="radius">Radius (miles)</label>
        <input id="radius" type="number" value="15" min="1" max="100" />
      </div>

      <button type="submit">Search tee times</button>
    </form>

    <div id="status"></div>
    <div id="results"></div>
  </main>

  <script src="/app.js"></script>
</body>
</html>
